<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Diagnóstico de voz</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: calc(env(safe-area-inset-top) + 12px) 16px 24px; background: #111418; color: #f2f4f7; font: 16px -apple-system, system-ui, sans-serif; }
    h1 { font-size: 1.4rem; }
    button { display: block; width: 100%; margin: 0 0 10px; padding: 14px; font: inherit; border-radius: 12px; border: 1px solid #2c323b; background: #1c2026; color: #f2f4f7; text-align: left; }
    button b { color: #f07f13; }
    pre { white-space: pre-wrap; word-break: break-word; background: #1c2026; border-radius: 12px; padding: 12px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Diagnóstico de voz</h1>
  <p>Pulsa cada botón y espera 3 segundos. Anota si oyes algo. Luego haz captura del recuadro de abajo.</p>
  <button id="b1"><b>1.</b> Voz simple (sin nada más)</button>
  <button id="b2"><b>2.</b> Como la app: desbloquear + cortar + hablar</button>
  <button id="b3"><b>3.</b> Cortar + hablar, sin desbloquear antes</button>
  <button id="b4"><b>4.</b> Sonido de prueba (pitido, no voz)</button>
  <button id="b5"><b>5.</b> Modo "reproducción" (audioSession) + voz</button>
  <button id="b6"><b>6.</b> Audio silencioso en bucle + voz</button>
  <pre id="log"></pre>
  <script>
    const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
    const s = window.speechSynthesis;
    log('UA: ' + navigator.userAgent);
    log('standalone: ' + (navigator.standalone ?? matchMedia('(display-mode: standalone)').matches));
    log('speechSynthesis: ' + Boolean(s));
    function voces() {
      const v = s ? s.getVoices() : [];
      const es = v.filter((x) => (x.lang || '').toLowerCase().replace('_', '-').startsWith('es'));
      return `voces=${v.length} es=${es.length} [${es.slice(0, 5).map((x) => x.name + ' ' + x.lang).join(', ')}]`;
    }
    log('al cargar: ' + voces());
    log('audioSession: ' + (navigator.audioSession ? navigator.audioSession.type : 'no existe'));
    s?.addEventListener?.('voiceschanged', () => log('voiceschanged: ' + voces()));
    function frase(texto, n) {
      const u = new SpeechSynthesisUtterance(texto);
      u.lang = 'es-ES';
      const v = s.getVoices().find((x) => (x.lang || '').toLowerCase().replace('_', '-') === 'es-es');
      if (v) u.voice = v;
      const t0 = performance.now();
      const ms = () => Math.round(performance.now() - t0) + 'ms';
      u.onstart = () => log(`[${n}] start ${ms()}`);
      u.onend = () => log(`[${n}] end ${ms()}`);
      u.onerror = (e) => log(`[${n}] error ${e.error} ${ms()}`);
      setTimeout(() => log(`[${n}] tras 1s: speaking=${s.speaking} pending=${s.pending}`), 1000);
      return u;
    }
    document.getElementById('b1').onclick = () => { log('--- prueba 1 · ' + voces()); s.speak(frase('Prueba uno. Zona 4, 20 segundos', 1)); };
    document.getElementById('b2').onclick = () => {
      log('--- prueba 2');
      const mudo = new SpeechSynthesisUtterance(' ');
      mudo.volume = 0;
      s.speak(mudo);
      s.cancel();
      s.speak(frase('Prueba dos. Zona 4, 20 segundos', 2));
    };
    document.getElementById('b3').onclick = () => { log('--- prueba 3'); s.cancel(); s.speak(frase('Prueba tres. Zona 4, 20 segundos', 3)); };
    document.getElementById('b4').onclick = () => {
      log('--- prueba 4 (pitido)');
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        o.frequency.value = 880;
        o.connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + 0.4);
        log('[4] audio state=' + ctx.state);
      } catch (e) { log('[4] error ' + e); }
    };
    document.getElementById('b5').onclick = () => {
      log('--- prueba 5');
      try { navigator.audioSession.type = 'playback'; log('[5] audioSession=' + navigator.audioSession.type); } catch (e) { log('[5] audioSession error ' + e); }
      s.speak(frase('Prueba cinco. Zona 4, 20 segundos', 5));
    };
    function wavSilencio(segundos) {
      const rate = 8000, n = rate * segundos, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
      const str = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
      str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
      v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
      str(36, 'data'); v.setUint32(40, n, true); for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
      return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    }
    document.getElementById('b6').onclick = () => {
      log('--- prueba 6');
      const a = new Audio(wavSilencio(1));
      a.loop = true;
      a.play().then(() => {
        log('[6] audio reproduciendo');
        s.speak(frase('Prueba seis. Zona 4, 20 segundos', 6));
      }).catch((e) => log('[6] audio error ' + e));
    };
  </script>
</body>
</html>
